name: ci

# UNVERIFIED: none of this has been run yet. It is first exercised by GitHub Actions after the
# push. Action versions come from research.md section 6 (README/package.json of each action's
# default branch).
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # UNVERIFIED action version: the repo was not read (research.md section 6). Stable Rust is
      # preinstalled on windows-latest, so this step can be dropped if @stable does not resolve.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # The workspace root owns target/, which is the default cache location.
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --all --check
      - run: cargo check --workspace
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # Cheap Linux mirror of check-windows (1x minutes). Catches everything that is not
  # Windows-specific and tells us whether Actions works at all when Windows runners do not start.
  check-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          # llvm provides llvm-rc, which tauri-winres needs for the cross cargo check against the MSVC target.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf llvm
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --all --check
      - run: cargo check --workspace
      - run: cargo check --workspace --target x86_64-pc-windows-msvc
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --target x86_64-pc-windows-msvc -- -D warnings

  build-installer:
    # Installers are built for main and version tags only; nothing is published or signed.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: check-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # UNVERIFIED action version (see above).
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      # tauri.conf.json's beforeBuildCommand builds mira-hook (release), copies it to
      # src-tauri/resources/ (scripts/copy-hook.mjs) and builds the frontend.
      # TODO(windows-verify): bundle.resources is the glob "resources/*" in tauri.conf.json; it
      # must pass `tauri build` here (plan D.12).
      - run: npm run tauri build
      - uses: actions/upload-artifact@v7
        with:
          name: mira-bots-windows-installers
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
      # TODO(windows-verify): the msi target needs WiX on the runner and may not build on
      # windows-latest (plan D.13). If it does not, set bundle.targets to ["nsis"] in
      # tauri.conf.json and delete this step. It must not fail the run when no msi exists.
      - uses: actions/upload-artifact@v7
        with:
          name: mira-bots-windows-msi
          path: target/release/bundle/msi/*.msi
          if-no-files-found: warn
