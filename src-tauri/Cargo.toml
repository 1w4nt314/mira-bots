[package]
name = "mira-bots"
version = "0.1.0"
description = "mira-bots: a status island for Claude Code agents"
edition = "2021"
license = "MIT"

[lib]
name = "mira_bots_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "time", "macros"] }
portable-pty = "0.9"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
log = "0.4"
env_logger = "0.11"
thiserror = "2"

[dev-dependencies]
mira-hook = { path = "../crates/mira-hook" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "time"] }
