<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 250" width="240" height="250" role="img" aria-label="Bot, færdig, researcher"><title>Bot, færdig, researcher</title><style>
.scan{animation:scan 1.6s ease-in-out infinite}
.bob{animation:bob .9s ease-in-out infinite}
.pulse{animation:pulse 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.zz{animation:zz 2s ease-in-out infinite}
.d1,.d2,.d3{animation:dd 1.2s ease-in-out infinite}.d2{animation-delay:.2s}.d3{animation-delay:.4s}
.tL{animation:t1 .7s ease-in-out infinite}.tR{animation:t2 .7s ease-in-out infinite}
.wL{animation:wl .8s ease-in-out infinite}.wR{animation:wr .8s ease-in-out infinite}
.lA{animation:ld .7s ease-in-out infinite}.lB{animation:ld .7s ease-in-out infinite;animation-delay:-.35s}.lP{animation:ld 1s ease-in-out infinite}
.prog{animation:prog 1.6s ease-in-out infinite}
@keyframes scan{0%,100%{transform:translateX(-4px)}50%{transform:translateX(4px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
@keyframes zz{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes dd{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes t1{0%,100%{transform:rotate(14deg)}50%{transform:rotate(32deg)}}
@keyframes t2{0%,100%{transform:rotate(-32deg)}50%{transform:rotate(-14deg)}}
@keyframes wl{0%,100%{transform:rotate(148deg)}50%{transform:rotate(168deg)}}
@keyframes wr{0%,100%{transform:rotate(-148deg)}50%{transform:rotate(-168deg)}}
@keyframes ld{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes prog{0%{transform:scaleX(.1)}80%,100%{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
